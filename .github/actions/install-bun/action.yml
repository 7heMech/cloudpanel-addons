name: Install Bun
description: >-
  Install the Bun pinned by packageManager in package.json, from its npm
  package, checked against the sha512 recorded here.

# Bun's dated canary builds are published to npm under fixed versions, while
# GitHub only keeps the latest canary under a tag that moves, so setup-bun
# cannot install a pinned canary. npm versions cannot be republished, and the
# sha512 below pins the exact tarball besides.
#
# To change Bun: set packageManager in package.json, then set version and
# sha512 here to the "integrity" npm gives for @oven/bun-linux-x64 at that
# version (npm view @oven/bun-linux-x64@<version> dist.integrity).

runs:
  using: composite
  steps:
    - name: Download and verify Bun
      shell: bash
      env:
        BUN_VERSION: 1.4.4-canary.20261108.1
        BUN_SHA512: HVu1zy94Q7TUx1BXiVk5dWh5ip/juNkKGsjEJOUPPCMjGFDuJPMC6OkvHW+U5f5wdSDHa3DRkuxQ16IUs1zthA==
      run: |
        set -euo pipefail
        pinned="$(jq -r .packageManager package.json)"
        if [ "$pinned" != "bun@$BUN_VERSION" ]; then
          echo "::error::package.json pins $pinned, but install-bun has the sha512 for bun@$BUN_VERSION"
          exit 1
        fi
        dir="$RUNNER_TEMP/bun"
        mkdir -p "$dir"
        tarball="$dir/bun.tgz"
        curl -fsSL --retry 3 -o "$tarball" \
          "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-$BUN_VERSION.tgz"
        actual="$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
        if [ "$actual" != "$BUN_SHA512" ]; then
          echo "::error::bun-linux-x64-$BUN_VERSION.tgz does not match the pinned sha512"
          exit 1
        fi
        tar -xzf "$tarball" -C "$dir" package/bin/bun
        install -d "$dir/bin"
        mv "$dir/package/bin/bun" "$dir/bin/bun"
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/bun" --revision
