# Checks that run on every change, not only on a tag.
#
# These same steps live in the release build job, which meant a broken merge
# was not caught until someone cut a tag -- and the only way to find out was to
# push a tag and watch it fail. Running them here makes a tag a formality
# rather than the first real test.

name: ci

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# A newer commit on the same branch contains the earlier one, so finishing both
# runs only delays feedback and consumes another runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    # Releases ship an x64 and an arm64 binary, each built and tested on its
    # own architecture, so both are checked here too.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        # The packageManager pin in package.json, as in release.yml.
        uses: ./.github/actions/install-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and the full test suite
        # Typechecking and tests can run independently, so run them together.
        run: |
          set -euo pipefail
          bun run typecheck & typecheck=$!
          bun run test
          wait "$typecheck"

      - name: Lint shell scripts
        if: matrix.arch == 'x64'
        # install.sh is the only shell script left in the repo, and a finding
        # here is a release blocker, not a style note: it is the bootstrap a
        # customer runs via `curl ... | bash` before any binary exists on the
        # box, so there is no compiler or test suite standing between a bug
        # in it and that customer's shell.
        # ubuntu-24.04 already includes ShellCheck. Refreshing the entire apt
        # index to reinstall it was consistently the slowest setup operation.
        # The script is the same on both architectures, so it is linted once.
        run: bun run lint:install

      - name: Build
        # Compiling is part of the check: a type error the checker tolerates
        # can still fail the compile.
        run: bun run build
