# Checks that run on every change, not only on a tag.
#
# These same steps live in the release build job, which meant a broken merge
# was not caught until someone cut a tag -- and the only way to find out was to
# push a tag and watch it fail. Running them here makes a tag a formality
# rather than the first real test.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Kept in step with release.yml. Bumping one alone is how the pinned
          # version stops being able to read bun.lock.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit checks for the client script and port allocation
        # It lives in a TypeScript template literal, so a stray escape reaches
        # the browser as a broken string and silently kills every button on the
        # page. Nothing else notices: the server still renders and answers.
        run: bun run test:app

      - name: Two addons must be able to patch one panel template
        # The scenario that is invisible with a single addon installed:
        # installing the second used to delete the first's nav entry, and
        # uninstalling either removed both.
        run: bun run test:inject

      - name: Certificate consent and failure handling
        run: bun run test:certificate

      - name: Installer keyboard selection
        run: python3 tools/test-installer.py

      - name: Deletion preserves data on failure
        run: bun run test:delete

      - name: Lint the wrapper scripts
        # The wrapper is the privilege boundary. A shellcheck finding there is
        # a merge blocker, not a style note.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning addons/*/wrapper/* tools/*.sh install.sh

      - name: Build
        # Compiling is part of the check: a type error the checker tolerates
        # can still fail `bun build --compile`.
        run: bun run build
