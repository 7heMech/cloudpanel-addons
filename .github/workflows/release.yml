# Release pipeline.
#
# These artifacts are installed by a root-run CLI and one of them is executed
# via sudo, so the supply chain matters as much as the code:
#
#   - third-party actions are pinned by commit SHA, not by tag, because a tag
#     can be moved to point at different code
#   - permissions default to none and are granted per job
#   - contents: write exists only on the job that uploads
#   - the trigger is a tag push, so a fork pull request cannot produce a release
#   - a build provenance attestation ties each artifact to this workflow run,
#     which is what SHA256SUMS cannot do: a checksum served next to a binary
#     detects corruption, not substitution

name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Must be able to read bun.lock. The lockfile is lockfileVersion 2,
          # which older Bun cannot parse, so --frozen-lockfile below fails with
          # a version that is merely "recent enough" by eye. Bump this and the
          # lockfile together, never one alone, and verify the pinned version
          # actually reads the lockfile before pushing a tag.
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint the wrapper scripts
        # The wrapper is the privilege boundary. A shellcheck finding there is
        # a release blocker, not a style note.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning addons/*/wrapper/* tools/*.sh install.sh

      - name: Resolve the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # recon showed avx2 on the target CPU, so the standard glibc x64
          # target applies rather than the baseline variant.
          for spec in "clp-addons-linux-x64:cli/index.ts" \
                      "instatic-app-linux-x64:addons/instatic/app/index.ts"; do
            out="dist/${spec%%:*}"
            entry="${spec#*:}"
            echo "building $out from $entry"
            bun build --compile --target=bun-linux-x64 \
              --define "process.env.CLP_ADDONS_VERSION=\"${VERSION}\"" \
              --outfile "$out" "$entry"
          done

      - name: Stage the wrapper scripts unchanged
        # Never compiled (decision 2.13): the wrapper's security value is that
        # a human can read it in one sitting.
        run: |
          set -euo pipefail
          for w in addons/*/wrapper/*; do
            install -m 0755 "$w" "dist/$(basename "$w")"
          done

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the build for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the provenance attestation
      attestations: write  # record it
    steps:
      - name: Download the build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/clp-addons-linux-x64
            dist/instatic-app-linux-x64
            dist/clp-action-instatic

      - name: Verify SHA256SUMS still matches what we are about to publish
        # Cheap guard against the artifact round-trip altering a byte.
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            dist/clp-addons-linux-x64 \
            dist/instatic-app-linux-x64 \
            dist/clp-action-instatic \
            dist/SHA256SUMS
