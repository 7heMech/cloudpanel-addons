<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We'll be right back</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f4f7fb; color: #172033; }
    main { width: min(100%, 620px); padding: clamp(32px, 7vw, 64px); border: 1px solid #dce3ee; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px rgba(31, 45, 74, .10); text-align: center; }
    svg { width: 64px; height: 64px; color: #5b6ee1; }
    h1 { margin: 24px 0 12px; font-size: clamp(2rem, 7vw, 3.25rem); line-height: 1.08; letter-spacing: -.035em; }
    p { margin: 0 auto; max-width: 44ch; color: #63708a; font-size: 1.08rem; line-height: 1.65; }
    @media (prefers-color-scheme: dark) {
      body { background: #101522; color: #f3f6fb; }
      main { background: #171e2e; border-color: #2a354b; box-shadow: none; }
      p { color: #aab5c8; }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/>
      <circle cx="12" cy="12" r="4"/>

    <h1>We'll be right back.</h1>
    <p>This site is undergoing scheduled maintenance. Please check back in a few minutes.</p>
  </main>
</body>
</html>
