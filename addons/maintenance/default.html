<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Site maintenance</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --background: #f8f8f6;
      --text: #242422;
      --muted: #65655f;
      --line: #dcdcd6;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 3rem 1.5rem;
      background: var(--background);
      color: var(--text);
    }

    main {
      width: min(100%, 36rem);
      overflow-wrap: anywhere;
      text-align: center;
    }

    .symbol {
      display: block;
      width: 3rem;
      height: 3rem;
      margin: 0 auto 2rem;
      color: var(--muted);
    }

    .label {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .16em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -.04em;
      text-wrap: balance;
    }

    .message {
      max-width: 36ch;
      margin: 1.25rem auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
      text-wrap: pretty;
    }

    .note {
      width: fit-content;
      max-width: 100%;
      margin: 2rem auto 0;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .8125rem;
      line-height: 1.6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #181818;
        --text: #ededeb;
        --muted: #a6a6a0;
        --line: #383836;
      }
    }
  </style>
</head>
<body>
  <main>
    <svg class="symbol" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
      <circle cx="24" cy="24" r="20"/>
      <path d="M20.5 18v12m7-12v12" stroke-linecap="round"/>
    </svg>
    <p class="label">Site maintenance</p>
    <h1>Temporarily unavailable</h1>
    <p class="message">This website is undergoing maintenance. Please check back later.</p>
    <p class="note">Thank you for your patience.</p>
  </main>
</body>
</html>
